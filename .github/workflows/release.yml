# 推一個 v* 開頭的 tag 就自動建置桌面版並發佈到 Releases。
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# 只跑 Windows：這是 Windows 專用工具（遊戲是 DOS/Windows 的，字形圖庫也是用
# GDI+ 烤出來的），沒有跨平台的需求。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # 也可以手動觸發，方便重跑失敗的建置

permissions:
  contents: write           # 建立 Release、上傳產物

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # windows runner 內建 Rust 與 MSVC，不必自己裝
      - name: 環境
        run: |
          node --version
          cargo --version
          rustc --version

      # Rust 相依編一次要好幾分鐘，快取起來
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: 安裝相依
        run: npm ci

      # 遊戲檔不在版控裡，所以吃遊戲資料的那些測試會自動略過（不會失敗）。
      # 剩下的純邏輯測試照跑，還是擋得住回歸。
      - name: 回歸測試
        run: npm test

      - name: 建置
        run: npx tauri build

      - name: 版本號一致性
        shell: pwsh
        run: |
          # 發佈門檻。單一來源是 package.json；這裡只讀不寫，負責攔住漏改的那一處。
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' |
                    Select-Object -First 1).Matches.Groups[1].Value
          "package.json  $v`ntauri.conf    $tauri`nCargo.toml    $cargo"
          if ($tauri -ne $v -or $cargo -ne $v) { throw "版本號不一致（見 docs/rules/VERSION_RULES.md §2.3）" }
          # tag 也要對得上
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$v") {
            throw "tag ${{ github.ref_name }} 與 package.json 的 v$v 不一致"
          }

      - name: 收產物
        shell: pwsh
        run: |
          # 命名依 docs/rules/RELEASE_RULES.md §2.1：只用 A-Za-z0-9.-_
          # GitHub 上傳附件時會把其餘字元換成點，本機與線上檔名一旦不同，校驗碼就失去意義。
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $t = 'src-tauri\target\release'
          Copy-Item "$t\rich2-editor.exe" "release\RICH2_EDITOR-v$v-Portable.exe"
          Copy-Item "$t\bundle\nsis\Rich2 Editor_${v}_x64-setup.exe" "release\RICH2_EDITOR-v$v-Setup.exe"

          # 校驗碼是必附項（RELEASE_RULES §4.3），且必須由實際上傳的檔案計算
          $lines = Get-ChildItem release\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines("$PWD\release\SHA256SUMS.txt", $lines,
            (New-Object System.Text.UTF8Encoding($false)))

          Get-ChildItem release | Format-Table Name, @{n='MB';e={'{0:N2}' -f ($_.Length/1MB)}}

      - name: 發佈
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v'

          # 內文必須是 CHANGELOG 中該版本區塊的內容，不含其他版本（RELEASE_RULES §4.4）
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md 找不到 [$version] 區塊（RELEASE_RULES §4.1 的發佈門檻）" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[').LineNumber
          $notes = (($(if ($end) { $rest[0..($end - 2)] } else { $rest })) -join "`n").Trim()

          gh release create $tag `
            (Get-ChildItem release\* | ForEach-Object { $_.FullName }) `
            --title "[RICH2_EDITOR] $tag Release" --notes $notes
